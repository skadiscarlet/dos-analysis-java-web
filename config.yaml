# dos-analysis-web Configuration

# 框架源码和数据库路径
frameworks:
  tomcat:
    repo: https://github.com/apache/tomcat.git
    branch: 9.0.x
    source_dir: frameworks/tomcat
    database: databases/tomcat-9.0-db

  spring-boot:
    repo: https://github.com/spring-projects/spring-boot.git
    branch: 2.7.x
    source_dir: frameworks/spring-boot
    database: databases/spring-boot-2.7-db

  jetty:
    repo: https://github.com/eclipse/jetty.project.git
    branch: jetty-11.0.15
    source_dir: frameworks/jetty-11.0.15
    database: databases/jetty-11-db

  undertow:
    repo: https://github.com/undertow-io/undertow.git
    branch: 2.3.7.Final
    source_dir: frameworks/undertow-2.3.7
    database: databases/undertow-2-db

  jersey:
    repo: https://github.com/eclipse-ee4j/jersey.git
    branch: 3.1.3
    source_dir: frameworks/jersey-3.1.3
    database: databases/jersey-3.1-db

# CodeQL 配置
codeql:
  binary: /usr/bin/codeql
  threads: 16
  ram_mb: 20480

# Phase 1 配置
phase1:
  manual_sources: intel/sources/phase1_manual.json

# 输出路径
output:
  results_dir: results
  intel_dir: intel

phase3:
  query: codeql/queries/phase3_candidate_features.ql
  results_dir: results/phase3
  merged_csv: results/phase3/phase3_candidate_features.csv
  consistency_json: results/phase3/phase3_consistency.json
  report: results/phase3_report.md
