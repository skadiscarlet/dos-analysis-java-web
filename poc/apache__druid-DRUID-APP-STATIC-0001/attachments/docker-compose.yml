version: "2.2"

volumes:
  metadata_data: {}
  middle_var: {}
  historical_var: {}
  broker_var: {}
  coordinator_var: {}
  router_var: {}
  druid_shared: {}

services:
  postgres:
    container_name: druiddos_apache_druid_postgres
    image: postgres:17.6
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - metadata_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=FoolishPassword
      - POSTGRES_USER=druid
      - POSTGRES_DB=druid

  zookeeper:
    container_name: druiddos_apache_druid_zookeeper
    image: zookeeper:3.5.10
    ports:
      - "127.0.0.1:12181:2181"
    environment:
      - ZOO_MY_ID=1

  coordinator:
    image: apache/druid:37.0.0
    container_name: druiddos_apache_druid_coordinator
    volumes:
      - druid_shared:/opt/shared
      - coordinator_var:/opt/druid/var
    depends_on:
      - zookeeper
      - postgres
    ports:
      - "127.0.0.1:19081:8081"
    command:
      - coordinator
    env_file:
      - environment

  broker:
    image: apache/druid:37.0.0
    container_name: druiddos_apache_druid_broker
    volumes:
      - broker_var:/opt/druid/var
    depends_on:
      - zookeeper
      - postgres
      - coordinator
    ports:
      - "127.0.0.1:19082:8082"
    command:
      - broker
    env_file:
      - environment

  historical:
    image: apache/druid:37.0.0
    container_name: druiddos_apache_druid_historical
    volumes:
      - druid_shared:/opt/shared
      - historical_var:/opt/druid/var
    depends_on:
      - zookeeper
      - postgres
      - coordinator
    ports:
      - "127.0.0.1:19083:8083"
    command:
      - historical
    env_file:
      - environment

  middlemanager:
    image: apache/druid:37.0.0
    container_name: druiddos_apache_druid_middlemanager
    volumes:
      - druid_shared:/opt/shared
      - middle_var:/opt/druid/var
    depends_on:
      - zookeeper
      - postgres
      - coordinator
    ports:
      - "127.0.0.1:19091:8091"
      - "127.0.0.1:19100-19105:8100-8105"
    command:
      - middleManager
    env_file:
      - environment

  router:
    image: apache/druid:37.0.0
    container_name: druiddos_apache_druid_router
    volumes:
      - router_var:/opt/druid/var
    depends_on:
      - zookeeper
      - postgres
      - coordinator
    ports:
      - "127.0.0.1:19088:8888"
    command:
      - router
    env_file:
      - environment
